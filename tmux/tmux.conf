
# Set terminal colors
set-option -sa terminal-overrides ",xterm*:Tc"

# Enable mouse support
set -g mouse on

# Scroll one line per mouse-wheel event
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down

# Copy mouse selections without leaving copy mode or jumping to the live bottom
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe

# Gruvbox Dark
set -g status-style "bg=#282828,fg=#a89984"
set -g status-left "#[bg=#d65d0e,fg=#282828,bold] #S #[default]"
set -g status-right "#[fg=#928374]%Y-%m-%d #[fg=#fabd2f,bold]%H:%M "
set -g window-status-format "#[fg=#a89984] #{?window_bell_flag,#[fg=#fe8019]#[bold]● #[fg=#a89984]#[nobold],}#I:#W "
set -g window-status-current-format "#[bg=#3c3836,fg=#fabd2f,bold] #{?window_bell_flag,#[fg=#fe8019]● #[fg=#fabd2f],}#I:#W "
set -g window-status-activity-style "fg=#fe8019,bold"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fe8019"
set -g message-style "bg=#3c3836,fg=#fabd2f"
set -g mode-style "bg=#fabd2f,fg=#282828"
set -g clock-mode-colour "#fabd2f"

# Codex emits BEL when a turn completes. Mark inactive windows with the status
# icon above, suppress the audible bell, and let tmux clear it when selected.
set-window-option -g monitor-bell on
set -g bell-action none

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Open new windows in the active pane's current directory
bind-key c new-window -c "#{pane_current_path}"

# kill pane
bind-key x kill-pane

# Pane resizing
bind -n M-h resize-pane -L
bind -n M-l resize-pane -R
bind -n M-k resize-pane -U
bind -n M-j resize-pane -D

# Move window to the left
bind -n M-i swap-window -t -1

# Move window to the right
bind -n M-o swap-window -t +1

# Set vi mode
set-window-option -g mode-keys vi

# Use visual selection mode as vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Save and restore session
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

TMUX_FZF_ORDER="session|window|pane|command|keybinding"
TMUX_FZF_OPTIONS="-p -w 90% -h 70% -m"

# more options here: https://github.com/sainnhe/tmux-fzf/issues/6#issuecomment-578750879
bind w run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/window.sh switch"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'
